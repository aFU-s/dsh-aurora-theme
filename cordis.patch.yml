# dsh-aurora-theme — bundle patch for a dsh profile.
#
# Installing this package adds one plugin row. That row is what enrolls the
# package in the browser roster: the dsh-client-modules node half scans the
# Loader's entries and picks up every package declaring `dsh.client`, serves its
# `./client` bundle at /plugins/<row-id>/client.js, and composes it into
# window.__DSH_BOOT__. Without the row below, lib/client.js is never served and
# the theme never appears — the two halves ship together on purpose.
#
# The host half is deliberately inert (see src/host.js); it exists so the row
# mounts. All behaviour lives in the browser half.

- insert:
    - id: aurora-theme
      name: dsh-aurora-theme
